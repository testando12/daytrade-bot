<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab — Estratégias</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0e17; color: #e0e6ed; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%); padding: 20px 30px; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.4rem; color: #58a6ff; }
        .header h1 span { color: #8b949e; font-weight: 300; }
        .header .meta { color: #8b949e; font-size: 0.85rem; }
        .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; padding: 20px 30px; }
        .kpi { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 18px; }
        .kpi .label { color: #8b949e; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .kpi .value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
        .kpi .value.positive { color: #3fb950; }
        .kpi .value.negative { color: #f85149; }
        .kpi .value.neutral { color: #58a6ff; }
        .engines { padding: 20px 30px; }
        .engines h2 { color: #c9d1d9; font-size: 1.1rem; margin-bottom: 16px; border-bottom: 1px solid #21262d; padding-bottom: 8px; }
        .engines-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
        .engine-card { background: #161b22; border: 1px solid #21262d; border-radius: 10px; padding: 16px; transition: border-color 0.2s; }
        .engine-card:hover { border-color: #388bfd; }
        .engine-card .name { font-weight: 600; font-size: 1rem; color: #c9d1d9; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .engine-card .name .alloc { color: #8b949e; font-size: 0.8rem; font-weight: 400; }
        .engine-card .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .engine-card .stat { }
        .engine-card .stat .sl { color: #8b949e; font-size: 0.75rem; }
        .engine-card .stat .sv { font-size: 0.95rem; font-weight: 600; }
        .engine-card .signal { margin-top: 10px; padding-top: 10px; border-top: 1px solid #21262d; font-size: 0.85rem; color: #8b949e; }
        .signal .buy { color: #3fb950; font-weight: 600; }
        .signal .sell { color: #f85149; font-weight: 600; }
        .signal .hold { color: #8b949e; }
        .history { padding: 20px 30px; }
        .history h2 { color: #c9d1d9; font-size: 1.1rem; margin-bottom: 12px; border-bottom: 1px solid #21262d; padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 10px; overflow: hidden; }
        th { background: #1c2128; color: #8b949e; font-size: 0.75rem; text-transform: uppercase; padding: 10px 12px; text-align: left; }
        td { padding: 8px 12px; border-top: 1px solid #21262d; font-size: 0.85rem; }
        .pnl-pos { color: #3fb950; }
        .pnl-neg { color: #f85149; }
        .actions { padding: 20px 30px; display: flex; gap: 12px; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-refresh { background: #1f6feb; color: #fff; }
        .btn-reset { background: #21262d; color: #f85149; border: 1px solid #f8514930; }
        .status-bar { padding: 10px 30px; color: #8b949e; font-size: 0.8rem; border-top: 1px solid #21262d; margin-top: 20px; }
        .no-data { text-align: center; padding: 60px; color: #484f58; }
        .no-data p { margin-top: 8px; font-size: 0.9rem; }
        .rank { display: inline-block; width: 22px; height: 22px; border-radius: 50%; text-align: center; line-height: 22px; font-size: 0.7rem; font-weight: 700; margin-right: 6px; }
        .rank-1 { background: #ffd700; color: #000; }
        .rank-2 { background: #c0c0c0; color: #000; }
        .rank-3 { background: #cd7f32; color: #fff; }
        .rank-other { background: #21262d; color: #8b949e; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔬 Lab <span>— Laboratório de Estratégias</span></h1>
        <div class="meta" id="meta">Carregando...</div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="actions">
        <button class="btn btn-refresh" onclick="loadData()">⟳ Atualizar</button>
        <button class="btn btn-reset" onclick="resetLab()">Resetar Lab</button>
    </div>

    <div class="engines">
        <h2>Engines — Comparativo</h2>
        <div class="engines-grid" id="engines-grid"></div>
    </div>

    <div class="history">
        <h2>Últimos Ciclos</h2>
        <div id="history-table"></div>
    </div>

    <div class="status-bar" id="status-bar">Conectando...</div>

    <script>
        const BASE = window.location.origin;

        async function loadData() {
            try {
                const r = await fetch(`${BASE}/lab/results`);
                const json = await r.json();
                if (!json.success) throw new Error('Erro ao carregar');
                render(json.data);
                document.getElementById('status-bar').textContent =
                    `Última atualização: ${new Date().toLocaleString('pt-BR')}`;
            } catch (e) {
                document.getElementById('status-bar').textContent = `Erro: ${e.message}`;
            }
        }

        function render(data) {
            // Meta
            const meta = document.getElementById('meta');
            meta.textContent = data.last_feed_at
                ? `Último feed: ${new Date(data.last_feed_at).toLocaleString('pt-BR')} | ${data.total_cycles} ciclos`
                : 'Aguardando primeiro feed...';

            // KPIs
            const kpis = document.getElementById('kpis');
            const totalPnl = Object.values(data.engines || {}).reduce((s, e) => s + (e.total_pnl || 0), 0);
            const totalWins = Object.values(data.engines || {}).reduce((s, e) => s + (e.win_count || 0), 0);
            const totalLosses = Object.values(data.engines || {}).reduce((s, e) => s + (e.loss_count || 0), 0);
            const wrTotal = (totalWins + totalLosses) > 0 ? (totalWins / (totalWins + totalLosses) * 100).toFixed(1) : '0.0';

            kpis.innerHTML = `
                <div class="kpi">
                    <div class="label">Capital Virtual</div>
                    <div class="value neutral">$${data.capital_virtual?.toFixed(2) || '10,000.00'}</div>
                </div>
                <div class="kpi">
                    <div class="label">P&L Total Lab</div>
                    <div class="value ${totalPnl >= 0 ? 'positive' : 'negative'}">$${totalPnl >= 0 ? '+' : ''}${totalPnl.toFixed(2)}</div>
                </div>
                <div class="kpi">
                    <div class="label">Win Rate Geral</div>
                    <div class="value neutral">${wrTotal}%</div>
                </div>
                <div class="kpi">
                    <div class="label">Ciclos</div>
                    <div class="value neutral">${data.total_cycles}</div>
                </div>
            `;

            // Engines - ordenados por P&L
            const grid = document.getElementById('engines-grid');
            const engines = Object.entries(data.engines || {});
            if (engines.length === 0) {
                grid.innerHTML = '<div class="no-data"><p>Nenhum engine rodou ainda. Aguardando dados do bot local...</p></div>';
                return;
            }

            engines.sort((a, b) => (b[1].total_pnl || 0) - (a[1].total_pnl || 0));
            grid.innerHTML = engines.map(([name, e], i) => {
                const pnlClass = e.total_pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
                const rankClass = i < 3 ? `rank-${i+1}` : 'rank-other';
                const sig = e.last_signal;
                const sigClass = sig?.signal === 'BUY' ? 'buy' : sig?.signal === 'SELL' ? 'sell' : 'hold';

                return `
                    <div class="engine-card">
                        <div class="name">
                            <span><span class="rank ${rankClass}">${i+1}</span>${name.replace(/_/g, ' ')}</span>
                            <span class="alloc">${e.alloc_pct?.toFixed(0) || 0}% alloc</span>
                        </div>
                        <div class="stats">
                            <div class="stat"><div class="sl">P&L Total</div><div class="sv ${pnlClass}">$${e.total_pnl >= 0 ? '+' : ''}${e.total_pnl?.toFixed(2)}</div></div>
                            <div class="stat"><div class="sl">Win Rate</div><div class="sv">${e.win_rate?.toFixed(1)}%</div></div>
                            <div class="stat"><div class="sl">Wins / Losses</div><div class="sv">${e.win_count} / ${e.loss_count}</div></div>
                            <div class="stat"><div class="sl">Último P&L</div><div class="sv ${e.last_pnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">$${e.last_pnl?.toFixed(2)}</div></div>
                        </div>
                        <div class="signal">
                            Sinal: <span class="${sigClass}">${sig?.signal || 'N/A'}</span>
                            ${sig?.asset ? ` — ${sig.asset}` : ''}
                            ${sig?.score ? ` (${sig.score})` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            // History table
            const histDiv = document.getElementById('history-table');
            const hist = (data.recent_history || []).slice().reverse();
            if (hist.length === 0) {
                histDiv.innerHTML = '<div class="no-data"><p>Sem histórico ainda.</p></div>';
                return;
            }

            histDiv.innerHTML = `
                <table>
                    <thead><tr>
                        <th>#</th><th>Hora</th><th>Regime</th><th>P&L</th><th>Capital</th><th>Engines Ativos</th>
                    </tr></thead>
                    <tbody>
                        ${hist.map(h => {
                            const pnlC = h.total_pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
                            const active = Object.entries(h.engines || {})
                                .filter(([,v]) => v.signal && v.signal !== 'HOLD' && !v.error)
                                .map(([n,v]) => `${n.split('_')[0]}:${v.signal}`)
                                .join(', ') || '—';
                            const time = h.timestamp ? new Date(h.timestamp).toLocaleTimeString('pt-BR') : '—';
                            return `<tr>
                                <td>${h.cycle}</td>
                                <td>${time}</td>
                                <td>${h.regime || '—'}</td>
                                <td class="${pnlC}">$${h.total_pnl >= 0 ? '+' : ''}${h.total_pnl?.toFixed(2)}</td>
                                <td>$${h.capital?.toFixed(2)}</td>
                                <td>${active}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        async function resetLab() {
            if (!confirm('Resetar todo o Lab? Isso apaga o histórico.')) return;
            try {
                const r = await fetch(`${BASE}/lab/reset`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                const j = await r.json();
                alert(j.message);
                loadData();
            } catch (e) { alert('Erro: ' + e.message); }
        }

        // Auto-refresh a cada 5 minutos
        loadData();
        setInterval(loadData, 300000);
    </script>
</body>
</html>
